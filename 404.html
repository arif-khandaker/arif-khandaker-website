<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আরিফ খন্দকার | পাতাটি সরে গেছে</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://authorarifkhandaker.com/">
  <meta http-equiv="refresh" content="3; url=/">
  <script>
    /* পুরোনো ওয়ার্ডপ্রেস সাইটের ঠিকানাগুলো নতুন সাইটের সঠিক অংশে পাঠানো হয় */
    (function () {
      var path = decodeURIComponent(location.pathname).replace(/\/+$/, "");
      var map = [
        [/^\/187-2/, "/#books"],
        [/বই/, "/#books"],
        [/কবিতা/, "/#writings"],
        [/গল্প/, "/#writings"],
        [/যোগাযোগ|contact/i, "/#contact"],
        [/about|পরিচিতি/i, "/#intro"]
      ];
      var target = "/";
      for (var i = 0; i < map.length; i++) {
        if (map[i][0].test(path)) { target = map[i][1]; break; }
      }
      location.replace(target);
    })();
  </script>
  <style>
    html,body{margin:0;height:100%}
    body{display:flex;align-items:center;justify-content:center;background:#0e0d0b;color:#f7f3ea;
      font-family:"Noto Sans Bengali",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    .mark{width:56px;height:56px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #c9a45c;color:#c9a45c;font-size:28px}
    h1{font-weight:400;font-size:26px;margin:0 0 10px}
    p{color:#a59c8b;margin:0 0 22px;line-height:1.8}
    a{color:#e2c98f}
  </style>
</head>
<body>
  <div>
    <div class="mark">আ</div>
    <h1>পাতাটি নতুন ঠিকানায় সরে গেছে</h1>
    <p>আপনাকে আরিফ খন্দকারের ওয়েবসাইটে নিয়ে যাওয়া হচ্ছে…</p>
    <a href="/">এখনই যেতে এখানে চাপুন →</a>
  </div>
</body>
</html>
